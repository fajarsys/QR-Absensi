name: Deploy to Proxmox

on:
  push:
    branches:
      - main # Workflow berjalan setiap kali Anda melakukan push ke branch main

jobs:
  deploy:
    runs-on: self-hosted # Menginstruksikan GitHub untuk mengeksekusi ini di server Proxmox Anda

    steps:
      - name: 1. Tarik Pembaruan Kode
        run: |
          cd /opt/QR-Absensi
          git pull https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/fajarsys/QR-Absensi.git main

      - name: 2. Perbaiki Hak Akses File
        run: docker exec -u root absensi_app chown -R www-data:www-data /var/www/html

      - name: 3. Instal Dependensi Composer (Backend)
        run: docker exec absensi_app composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: 4. Kompilasi Aset Frontend
        run: |
          cd /opt/QR-Absensi
          npm install
          npm run build

      - name: 5. Eksekusi Migrasi Database
        run: echo "hallo, hallo"
      - name: 6. Manajemen Cache & Restart WebSocket
        run: |
          docker exec absensi_app php artisan optimize:clear
          docker exec absensi_app php artisan reverb:restart
