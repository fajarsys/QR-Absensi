name: Deploy Absensi to K3s

on:
  push:
    branches:
      - main

jobs:
  deploy_k3s:
    runs-on: self-hosted

    steps:
      - name: 1. Tarik Pembaruan Kode
        uses: actions/checkout@v4

      - name: 2. Build Docker Image (Termasuk Composer & NPM)
        run: |
          # Pastikan Dockerfile Anda berisi instruksi RUN composer install dan RUN npm run build
          docker build --build-arg VITE_REVERB_APP_KEY=zycv2vod14uvuds81ncq -t 10.0.0.101:5000/absensi-app:latest .

      - name: 3. Push Image ke Local Registry
        run: |
          docker push 10.0.0.101:5000/absensi-app:latest

      - name: 4. Setup Akses K3s
        run: |
          mkdir -p ~/.kube
          # Pastikan Anda menggunakan nama secret yang sama dengan portfolio (KUBE_KONFIG)
          echo "${{ secrets.KUBE_KONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: 5. Rollout Pod Baru
        run: |
          # Memerintahkan K3s untuk menarik image terbaru dan merestart Pod
          kubectl rollout restart deployment absensi-app
          kubectl rollout restart deployment absensi-reverb
          
          # JEDA PENTING: Menunggu hingga Pod aplikasi utama benar-benar berstatus 'Running'
          kubectl rollout status deployment/absensi-app

      - name: 6. Migrasi Database & Clear Cache
        run: |
          # Mencari nama Pod absensi-app secara dinamis
          POD_NAME=$(kubectl get pods -l app=absensi-app -o jsonpath="{.items[0].metadata.name}")
          
          # Eksekusi perintah artisan di dalam Pod yang baru menyala
          CONTAINER_NAME=$(kubectl get pods -l app=absensi-app -o jsonpath="{.items[0].spec.containers[0].name}")
          kubectl exec $POD_NAME -c $CONTAINER_NAME -- php artisan migrate --force
          kubectl exec $POD_NAME -c $CONTAINER_NAME -- php artisan optimize:clear